name: Validate Fish Scripts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate Fish Scripts
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize pacman and install Fish
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed fish

      - name: Validate Fish scripts
        run: bash ./test-local.sh
